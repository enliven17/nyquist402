      .boot-main { flex: 1; max-width: 1120px; margin: 0 auto; padding: 64px 40px; box-sizing: border-box; }

      @media (max-width: 1099px) { .boot-main { padding: 64px 24px; } }
      @media (prefers-reduced-motion: reduce) { .boot i { animation: none; } }
